      <stop offset="0%" stop-color="#C9B580" stop-opacity="0" />
      <stop offset="25%" stop-color="#C9B580" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#FFF8E9" stop-opacity="0.32" />
      <stop offset="82%" stop-color="#69A5A3" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#216B70" stop-opacity="0" />
