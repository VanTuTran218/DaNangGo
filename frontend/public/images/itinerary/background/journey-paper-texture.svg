<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <filter id="journal-paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.72
        0 0 0 0 0.65
        0 0 0 0 0.52
        0 0 0 0.08 0" in="noise" result="coloredNoise" />
    </filter>
    <pattern id="editorial-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#C9AB78" stroke-width="0.45" stroke-opacity="0.14" />
      <circle cx="80" cy="80" r="1" fill="#C9AB78" fill-opacity="0.22" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#editorial-grid)" />
  <rect width="100%" height="100%" filter="url(#journal-paper-grain)" />
</svg>
