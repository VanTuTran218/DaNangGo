<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="farMountainGrad" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E8D9C6" stop-opacity="0.18" />
      <stop offset="48%" stop-color="#DFCBB3" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#D4BC9E" stop-opacity="0.76" />
    </linearGradient>
    <linearGradient id="farRidgeRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF9EF" stop-opacity="0" />
      <stop offset="45%" stop-color="#EAB47D" stop-opacity="0.52" />
      <stop offset="78%" stop-color="#FFF9EF" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#C9AB78" stop-opacity="0.35" />
    </linearGradient>
  </defs>
  <!-- Distant overlapping tropical mountain silhouettes inspired by Son Tra & Central Vietnam -->
  <path
    d="M 180 340 C 370 315, 520 238, 700 248 C 865 256, 985 182, 1155 152 C 1310 124, 1455 138, 1600 116 L 1600 480 L 180 480 Z"
    fill="url(#farMountainGrad)"
  />
  <!-- Soft golden sunrise rim illumination along the upper mountain ridge -->
  <path
    d="M 240 332 C 410 306, 540 239, 700 248 C 865 256, 985 182, 1155 152 C 1310 124, 1455 138, 1600 116"
    stroke="url(#farRidgeRim)"
    stroke-width="1.4"
    stroke-linecap="round"
  />
</svg>
